name: Проверка P1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Проверка на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости
        run: python -m pip install -r requirements.txt
      - name: Проверить синтаксис
        run: python -m compileall -q src tests
      - name: Запустить локальные тесты без настоящих API
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
